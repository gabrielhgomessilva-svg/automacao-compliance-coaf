; ===== Configuração da Automação COAF (EXEMPLO) =====
; Copie este arquivo para "config.ini" (ao lado do programa) e ajuste os valores.
; O config.ini real NUNCA deve ir para o GitHub (já está no .gitignore).
; Linhas de comentário começam com ";". Não repita chaves.

; Pasta do ano. {ano} é trocado automaticamente.
; Dentro dela o programa cria MES\dd.mm.aaaa (ex.: OUTUBRO\07.10.2026)
PASTA_ARQUIVO = C:\COAF\ARQUIVO {ano}

; Pasta dos PDFs dos borderôs (só é usada se FONTE = pdf)
PASTA_BORDEROS = C:\COAF\BORDEROS

; Planilha de controle de risco (somente leitura)
PLANILHA_CONTROLE = C:\COAF\Controle de Risco Clientes.xls

; Planilha modelo (fica na pasta "modelo" ao lado do programa; NÃO vem no repositório)
PLANILHA_MODELO = modelo\modelo_planilha.xls

; Nome da aba do formulário dentro do modelo
ABA_FORMULARIO = Plan1

; Número do responsável pela avaliação, conforme a lista do seu modelo.
; Deixe vazio para manter o que está no modelo
RESPONSAVEL =

; Limite (R$) para "Pagamento a terceiro superior a"
LIMITE_TERCEIRO = 10000

; ===== Fonte dos borderôs de pagamento =====
; sql = lê direto do banco (SQL Server)  |  pdf = lê os PDFs da pasta acima
FONTE = sql

; Conexão SOMENTE LEITURA ao SQL Server.
SQL_SERVIDOR = SEU_SERVIDOR_OU_IP
SQL_BANCO = NOME_DA_BASE
; Driver ODBC instalado no PC (ex.: ODBC Driver 17 for SQL Server / ODBC Driver 18 for SQL Server)
SQL_DRIVER = ODBC Driver 17 for SQL Server
; Vazio = login do Windows. Se usar usuário SQL, peça à TI um usuário apenas de leitura
; (nunca use o "sa"). Nunca grave senha real em arquivo versionado.
SQL_USUARIO =
SQL_SENHA =
